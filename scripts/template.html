<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress</title>
<style>
  /* Palette: lavender-to-violet backdrop, ink-black panels, cream type, chartreuse accent. */
  :root {
    color-scheme: light;
    --bg: #f1edff; --glow: #cfc2ff; --glow-2: #e4dcff; --surface: #ffffff; --hover: #f6f3ff; --text: #15131b; --muted: #5c5573;
    --line: #e4ddf8; --track: #e3dbfa; --done: #5b3cf0; --doing: #6aa204; --focus: #5b3cf0; --neon: 40%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0c11; --glow: #2c1f78; --glow-2: #171230; --surface: #16151b; --hover: #1e1c26; --text: #fdf6d8; --muted: #a49dba;
      --line: #27242f; --track: #26222f; --done: #7d5cff; --doing: #c8f560; --focus: #c8f560; --neon: 75%;
    }
  }
  /* Hosts such as claude.ai artifacts force a theme through data-theme. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0c11; --glow: #2c1f78; --glow-2: #171230; --surface: #16151b; --hover: #1e1c26; --text: #fdf6d8; --muted: #a49dba;
    --line: #27242f; --track: #26222f; --done: #7d5cff; --doing: #c8f560; --focus: #c8f560; --neon: 75%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background:
      radial-gradient(60rem 32rem at 80% -10%, var(--glow), transparent 70%) no-repeat,
      radial-gradient(40rem 28rem at 0% 0%, var(--glow-2), transparent 70%) no-repeat,
      var(--bg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
  .kind { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 6px 0 32px; font-size: 26px; line-height: 1.25; }
  .pct { font-size: 56px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .summary { margin: 12px 0 18px; color: var(--muted); }
  /* Neon tube: a hot, near-white core and a soft halo, over a thin unlit track. */
  .bar { position: relative; display: flex; align-items: center; height: 6px; }
  .bar::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%);
    border-radius: 99px; background: var(--track);
  }
  /* Plasma: two bands of light slide through the tube at different speeds and interfere,
     so the shimmer never quite repeats, while the halo hums. In-progress runs hotter.
     --phase (set from the clock in the script) keeps the motion continuous across reloads. */
  .bar span {
    --c: var(--done); --hot: color-mix(in srgb, var(--c), #fff 65%);
    position: relative; height: 100%; overflow: hidden;
    background: linear-gradient(var(--c), var(--hot) 50%, var(--c));
    box-shadow: 0 0 3px var(--c), 0 0 12px color-mix(in srgb, var(--c) var(--neon), transparent),
      0 0 28px color-mix(in srgb, var(--c) calc(var(--neon) / 2), transparent);
    animation: hum 2.6s ease-in-out var(--phase, 0s) infinite;
  }
  .bar span::before, .bar span::after {
    content: ""; position: absolute; inset: 0; mix-blend-mode: screen;
    background: repeating-linear-gradient(90deg, transparent 0 20px, var(--hot) 32px, transparent 44px 80px);
    animation: drift 1.3s linear var(--phase, 0s) infinite;
  }
  .bar span::after {
    background: repeating-linear-gradient(90deg, transparent 0 34px,
      color-mix(in srgb, var(--hot) 70%, transparent) 46px, transparent 58px 130px);
    animation-duration: 2.9s; animation-direction: reverse;
  }
  .bar .doing { --c: var(--doing); animation-duration: 1.4s; }
  .bar .doing::before { animation-duration: .8s; }
  .bar span:first-child { border-radius: 99px 0 0 99px; }
  .bar span:last-child { border-top-right-radius: 99px; border-bottom-right-radius: 99px; }
  .bar.thin { height: 3px; }
  .bar.thin::before { height: 1px; }
  .bar.thin span {
    box-shadow: 0 0 2px var(--c), 0 0 8px color-mix(in srgb, var(--c) var(--neon), transparent);
    animation-name: hum-thin;
  }
  @keyframes drift { to { background-position: 260px 0; } }
  @keyframes hum {
    50% {
      box-shadow: 0 0 4px var(--c), 0 0 18px color-mix(in srgb, var(--c) var(--neon), transparent),
        0 0 40px color-mix(in srgb, var(--c) calc(var(--neon) / 2), transparent);
    }
  }
  @keyframes hum-thin {
    50% { box-shadow: 0 0 3px var(--c), 0 0 12px color-mix(in srgb, var(--c) var(--neon), transparent); }
  }
  section { margin-top: 44px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  h2 { margin: 0; font-size: 16px; }
  .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  ul { margin: 14px 0 0; padding: 0; list-style: none; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  li + li { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; }
  summary { cursor: pointer; list-style: none; transition: background-color .15s; }
  summary:hover { background: var(--hover); }
  summary:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 12px; }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: ""; flex: none; align-self: center; width: 6px; height: 6px; margin-left: auto;
    border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s;
  }
  details[open] summary::after { transform: rotate(45deg); }
  .dot { flex: none; width: 10px; height: 10px; border: 2px solid var(--muted); border-radius: 50%; transform: translateY(1px); }
  .doing .dot { border-color: var(--doing); background: linear-gradient(90deg, var(--doing) 50%, transparent 50%); }
  .done .dot { border-color: var(--done); background: var(--done); }
  .id { flex: none; min-width: 2.5em; color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  li.done .title { color: var(--muted); }
  .details { padding: 2px 16px 14px 52px; color: var(--muted); font-size: 14px; }
  .details p { margin: 4px 0; }
  code { padding: 1px 4px; border-radius: 4px; background: var(--track); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) {
    summary, summary::after { transition: none; }
    .bar span, .bar span::before, .bar span::after { animation: none; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
  const RELOAD_MS = 10000
  const data = JSON.parse(document.getElementById('data').textContent)
  const store = {
    get(key, fallback) { try { return JSON.parse(sessionStorage.getItem(key)) ?? fallback } catch { return fallback } },
    set(key, value) { try { sessionStorage.setItem(key, JSON.stringify(value)) } catch {} },
  }
  const open = new Set(store.get('open', []))
  // Start every animation at a phase taken from the clock, so the page's 10 s reload doesn't visibly restart the plasma.
  document.documentElement.style.setProperty('--phase', `-${(Date.now() % 1e6) / 1000}s`)

  const escape = (text) => text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const inline = (text) => escape(text)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  const share = (part, total) => (total ? (part / total) * 100 : 0)
  // Only lit segments are rendered, so the first and last spans get the rounded tube ends.
  const bar = (t, extra = '') =>
    `<div class="bar ${extra}">` +
    ['done', 'doing'].filter((state) => t[state])
      .map((state) => `<span class="${state}" style="width:${share(t[state], t.total)}%"></span>`).join('') +
    `</div>`

  function item(entry, key) {
    const head = `<span class="dot"></span><span class="id">${escape(entry.id)}</span><span class="title">${inline(entry.title)}</span>`
    if (!entry.details.length) return `<li class="${entry.state}"><div class="row">${head}</div></li>`
    const details = entry.details.map((line) => `<p>${inline(line)}</p>`).join('')
    return `<li class="${entry.state}"><details data-key="${escape(key)}"${open.has(key) ? ' open' : ''}>` +
      `<summary class="row">${head}</summary><div class="details">${details}</div></details></li>`
  }

  const goal = data.mode === 'goal'
  const noun = goal ? 'criteria met' : 'tasks done'
  document.title = `${data.pct}% · ${data.title}`
  document.getElementById('app').innerHTML = `
    <div class="kind">${goal ? 'Goal' : 'Stages'}</div>
    <h1>${inline(data.title)}</h1>
    <div class="pct">${data.pct}%</div>
    <p class="summary">${data.done} of ${data.total} ${noun}${data.doing ? ` · ${data.doing} in progress` : ''}</p>
    ${bar(data)}
    ${data.sections.map((section) => `
      <section>
        <div class="head"><h2>${inline(section.name)}</h2><span class="count">${section.done}/${section.total}</span></div>
        ${bar(section, 'thin')}
        <ul>${section.items.map((entry) => item(entry, `${section.name}/${entry.id || entry.title}`)).join('')}</ul>
      </section>`).join('')}
    <footer>Updated ${new Date(data.updated).toLocaleString()} · refreshes every ${RELOAD_MS / 1000} s</footer>`

  document.querySelectorAll('details').forEach((el) => el.addEventListener('toggle', () => {
    el.open ? open.add(el.dataset.key) : open.delete(el.dataset.key)
    store.set('open', [...open])
  }))
  window.scrollTo(0, store.get('scroll', 0))
  setTimeout(() => {
    store.set('scroll', window.scrollY)
    location.reload()
  }, RELOAD_MS)
</script>
</body>
</html>
